name: Test

on:
  pull_request:
    branches:
      - release
      - develop

env:
  CARGO_TERM_COLOR: always

jobs:
  Test:
    name: fleetcom Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --verbose

  MSRV:
    name: fleetcom MSRV (rust-version floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep the toolchain here in lockstep with `rust-version` in Cargo.toml:
      # this job exists to fail when a dependency bump silently raises the floor.
      - run: rustup update 1.88 && rustup default 1.88
      - run: cargo check --all-targets
